<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar cita | CardioCita</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/citas.css">
</head>
<body>

    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>CardioCita</h2>
                <span>Gestión cardiovascular</span>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <span>⌂</span> Inicio
                </a>
                <a href="pacientes.html" class="nav-link">
                    <span>♙</span> Pacientes
                </a>
                <a href="registrar-paciente.html" class="nav-link">
                    <span>＋</span> Registrar paciente
                </a>
                <a href="citas.html" class="nav-link active">
                    <span>▦</span> Citas médicas
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="logoutButton" class="logout-button">
                    Cerrar sesión
                </button>
            </div>
        </aside>

        <main class="main-content">

            <header class="page-header">
                <div>
                    <h1>Registrar cita médica</h1>
                    <p>Completa los datos para programar una nueva consulta.</p>
                </div>

                <a href="citas.html" class="secondary-button">
                    Volver a citas
                </a>
            </header>

            <section class="appointment-form-section">

                <div class="appointment-form-heading">
                    <h2>Información de la cita</h2>
                    <p>Los campos marcados con * son obligatorios.</p>
                </div>

                <form id="appointmentForm">

                    <div class="appointment-form-grid">

                        <div class="form-group full-width">
                            <label for="paciente">Paciente *</label>
                            <select id="paciente" name="paciente" required>
                                <option value="">Seleccionar paciente</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fecha">Fecha de la cita *</label>
                            <input
                                type="date"
                                id="fecha"
                                name="fecha"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="hora">Hora de la cita *</label>
                            <input
                                type="time"
                                id="hora"
                                name="hora"
                                required
                            >
                        </div>

                        <div class="form-group full-width">
                            <label for="motivo">Motivo de la consulta *</label>
                            <textarea
                                id="motivo"
                                name="motivo"
                                rows="4"
                                maxlength="300"
                                placeholder="Describe brevemente el motivo de la consulta..."
                                required
                            ></textarea>
                        </div>

                    </div>

                    <p id="appointmentMessage" class="appointments-message"></p>

                    <div class="appointment-form-actions">
                        <a href="citas.html" class="secondary-button">
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            id="saveAppointmentButton"
                            class="primary-button"
                        >
                            Registrar cita
                        </button>
                    </div>

                </form>
            </section>

        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/registrar-cita.js"></script>

</body>
</html>
