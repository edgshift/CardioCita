
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | CardioCita</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <main>
        <section>
            <h1>CardioCita</h1>

            <p>Bienvenido al sistema de gestión cardiovascular.</p>

            <form id="loginForm">

                <fieldset>
                    <legend>Iniciar sesión</legend>

                    <div>
                        <label for="usuario">Usuario</label>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Ingrese su usuario"
                            autocomplete="username"
                            required
                        >

                        <small>Introduzca su nombre de usuario.</small>
                    </div>

                    <div>
                        <label for="password">Contraseña</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingrese su contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <small>Introduzca su contraseña de acceso.</small>
                    </div>
                </fieldset>

                <div id="loginMessage" role="alert" aria-live="polite"></div>

                <div>
                    <button type="submit" id="loginButton">
                        Iniciar sesión
                    </button>
                </div>

            </form>
        </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

</body>
</html>
